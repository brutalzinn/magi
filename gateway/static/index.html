<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAGI — Protocol 111</title>
<link rel="icon" href="data:," />

<!-- React Flow styles (reused lib for the live packet graph) -->
<link rel="stylesheet" href="https://esm.sh/@xyflow/react@12/dist/style.css" />

<style>
  :root {
    --bg: #0f1115; --panel: #161a20; --panel2: #1b2028; --line: #262c36;
    --text: #c7ccd4; --muted: #838b98;
    --aff: #4b7f6a; --neg: #9a6b4b; --abs: #5b6270; --gw: #5a6b8c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
  #root { height: 100%; }
  .app { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: auto 1fr;
    height: 100%; gap: 1px; background: var(--line); }
  .bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel); }
  .bar h1 { font-size: 15px; letter-spacing: 3px; margin: 0; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--abs); display: inline-block; }
  .dot.on { background: var(--aff); }
  .badge { margin-left: auto; padding: 3px 10px; border: 1px solid var(--line);
    border-radius: 4px; color: var(--muted); font-size: 12px; }
  .badge.consensus { color: var(--aff); border-color: var(--aff); }
  .badge.veto { color: var(--neg); border-color: var(--neg); }
  .badge.deadlock { color: var(--abs); }
  .badge.deliberating { color: var(--gw); border-color: var(--gw); }
  .toggle { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  .left { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .graphwrap { flex: 1; min-height: 0; position: relative; }
  .packets { height: 220px; border-top: 1px solid var(--line); background: #0b0d11; display: flex; flex-direction: column; }
  .phead { padding: 6px 10px; font-size: 11px; letter-spacing: 1px; color: var(--muted);
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .plog { flex: 1; overflow-y: auto; padding: 4px 0;
    font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pkt { display: flex; gap: 8px; padding: 1px 10px; }
  .pkt .dir { flex: none; width: 12px; text-align: center; }
  .pkt.out .dir { color: var(--gw); }
  .pkt.in .dir { color: var(--aff); }
  .pkt.sys .dir { color: var(--muted); }
  .pkt .who { flex: none; width: 72px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .pkt .body { flex: 1; color: var(--text); opacity: 0.9; white-space: pre-wrap; word-break: break-word; }
  .pkt .tag { color: var(--muted); margin-right: 4px; }
  .panels { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .cards { display: flex; flex-direction: column; gap: 1px; background: var(--line); }
  .card { background: var(--panel2); padding: 10px 12px; }
  .card .name { font-size: 12px; letter-spacing: 1px; color: var(--muted); }
  .card .row { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .verdict { font-weight: 600; }
  .verdict.AFFIRMATIVE { color: var(--aff); }
  .verdict.NEGATIVE { color: var(--neg); }
  .verdict.ABSTAIN, .verdict.PENDING { color: var(--abs); }
  .conf { color: var(--muted); font-size: 12px; }
  .reason { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .tool { color: var(--gw); font-size: 12px; }

  .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); }
  .thread { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 10px; border-radius: 6px; max-width: 90%; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #222a36; }
  .msg.magi { align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); }
  .msg.sys { align-self: center; color: var(--muted); font-size: 12px; background: transparent; }
  .compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .compose input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 8px 10px; border-radius: 6px; outline: none; }
  .compose button { background: var(--gw); border: none; color: #0f1115; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-weight: 600; }
  .compose button:disabled { opacity: 0.5; cursor: default; }

  .react-flow__attribution { display: none; }

  /* Responsive — stack to a single scrollable column on tablets/phones. */
  @media (max-width: 820px) {
    html, body { height: auto; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; min-height: 100vh; }
    .bar { grid-column: 1 / -1; flex-wrap: wrap; gap: 8px 12px; }
    .graphwrap { height: 44vh; }
    .packets { height: 30vh; }
    .panels { min-height: 0; }
    .chat { min-height: 52vh; }
  }
  @media (max-width: 480px) {
    .bar h1 { font-size: 13px; letter-spacing: 2px; }
    .graphwrap { height: 40vh; }
    .pkt .who { width: 60px; }
    .msg { max-width: 96%; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "htm": "https://esm.sh/htm@3.1.1",
    "@xyflow/react": "https://esm.sh/@xyflow/react@12?external=react,react-dom"
  }
}
</script>

<script type="module">
import React, { useState, useEffect, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import { ReactFlow, Background, getBezierPath } from '@xyflow/react';
import htm from 'htm';

const html = htm.bind(React.createElement);

// PacketEdge draws the wire and, when active, a real packet (a glowing dot)
// travelling along it — gateway->brain on dispatch, brain->gateway on response.
function PacketEdge({ id, sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, data }) {
  const [edgePath] = getBezierPath({ sourceX, sourceY, sourcePosition, targetX, targetY, targetPosition });
  const pid = `pkt-${id}`;
  const wire = (data && data.color) || '#39414d';
  const active = data && data.active;
  const back = data && data.dir === 'in';
  const dot = back ? '#7ee0a6' : '#8ab4ff'; // green returning, blue outgoing
  const kp = back ? '1;0' : '0;1';
  return html`
    <g>
      <path id=${pid} d=${edgePath} fill="none" stroke=${wire} strokeWidth=${(data && data.sw) || 1.5} />
      ${active && html`
        <g>
          <circle r="10" fill=${dot} opacity="0.22" />
          <circle r="5.5" fill=${dot} opacity="0.5" />
          <circle r="3" fill="#ffffff" />
          <animateMotion dur="1.1s" repeatCount="indefinite" keyPoints=${kp} keyTimes="0;1" calcMode="linear">
            <mpath href=${'#' + pid} />
          </animateMotion>
        </g>`}
    </g>`;
}
const edgeTypes = { packet: PacketEdge };
const BRAINS = ['melchior', 'balthasar', 'casper'];
const TITLE = { melchior: 'MELCHIOR · Logic', balthasar: 'BALTHASAR · Protect', casper: 'CASPER · Linear' };
const COLOR = { AFFIRMATIVE: 'var(--aff)', NEGATIVE: 'var(--neg)', ABSTAIN: 'var(--abs)', PENDING: 'var(--abs)' };
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const NODE_POS = {
  gateway: { x: 250, y: 20 },
  melchior: { x: 30, y: 210 },
  balthasar: { x: 250, y: 270 },
  casper: { x: 470, y: 210 },
};

function blankBrains() {
  const s = {};
  for (const b of BRAINS) s[b] = { verdict: 'PENDING', confidence: null, reasoning: '', tool: '' };
  return s;
}

function App() {
  const [connected, setConnected] = useState(false);
  const [status, setStatus] = useState('idle');
  const [round, setRound] = useState(0);
  const [brains, setBrains] = useState(blankBrains());
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [motion, setMotion] = useState(!prefersReduced);
  // edgeDir[brain]: 'idle' | 'out' (gateway->brain) | 'in' (brain->gateway) | 'settled'
  const [edgeDir, setEdgeDir] = useState({});
  const [packets, setPackets] = useState([]);
  const threadRef = useRef(null);
  const plogRef = useRef(null);
  const pktId = useRef(0);

  const pushPkt = useCallback((dir, who, type, text) => setPackets((p) => {
    const next = [...p, { id: ++pktId.current, dir, who, type, text: text || '' }];
    return next.length > 200 ? next.slice(next.length - 200) : next;
  }), []);

  const pushMsg = useCallback((role, text) => setMessages((m) => [...m, { role, text }]), []);
  const settleAll = useCallback(() => setEdgeDir((s) => {
    const n = { ...s };
    for (const k of Object.keys(n)) if (n[k] === 'out' || n[k] === 'in') n[k] = 'settled';
    return n;
  }), []);

  useEffect(() => {
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [messages]);

  useEffect(() => {
    if (plogRef.current) plogRef.current.scrollTop = plogRef.current.scrollHeight;
  }, [packets]);

  useEffect(() => {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => setConnected(true);
    ws.onclose = () => setConnected(false);
    ws.onmessage = (e) => {
      let ev; try { ev = JSON.parse(e.data); } catch { return; }
      switch (ev.type) {
        case 'round_start':
          setStatus('deliberating'); setRound(ev.round); setBrains(blankBrains()); setEdgeDir({});
          pushPkt('sys', '—', `ROUND ${ev.round}`, 'deliberation started');
          break;
        case 'grounding': // gateway resolved HP/Mana via a function call
          pushPkt('sys', 'fn', 'GROUNDING', ev.message);
          pushMsg('sys', `grounding · ${ev.message}`);
          break;
        case 'dispatch': // packet gateway -> brain
          setEdgeDir((s) => ({ ...s, [ev.brain]: 'out' }));
          pushPkt('out', ev.brain, 'DISPATCH', ev.payload);
          break;
        case 'verdict': // packet brain -> gateway
          setBrains((s) => ({ ...s, [ev.brain]: {
            verdict: ev.verdict, confidence: ev.confidence, reasoning: ev.reasoning, tool: ev.tool || '' } }));
          setEdgeDir((s) => ({ ...s, [ev.brain]: 'in' }));
          setTimeout(() => setEdgeDir((s) => (s[ev.brain] === 'in' ? { ...s, [ev.brain]: 'settled' } : s)), 1600);
          pushPkt('in', ev.brain, 'VERDICT',
            `${ev.verdict} conf=${ev.confidence} action=${ev.tool || '-'} ${ev.args || ''} :: ${ev.reasoning || ''}`);
          break;
        case 'consensus': setStatus('consensus'); settleAll();
          pushPkt('sys', '111', 'CONSENSUS', `round ${ev.round} → ${ev.tool || '(none)'}`); break;
        case 'veto': setStatus('veto'); settleAll();
          pushPkt('sys', 'balthasar', 'VETO', ev.message); pushMsg('sys', 'Balthasar protective veto'); break;
        case 'deadlock': setStatus('deadlock'); settleAll();
          pushPkt('sys', '—', 'DEADLOCK', ev.message); break;
        case 'action':
          pushPkt('sys', 'exec', 'ACTION', `${ev.tool}: ${ev.message || ''}`);
          pushMsg('sys', `action · ${ev.tool}: ${ev.message || ''}`); break;
        case 'notify':
          pushPkt('sys', 'exec', 'NOTIFY', ev.message);
          pushMsg('sys', `notify · ${ev.message || ''}`); break;
        case 'final': pushPkt('sys', '111', 'FINAL', ev.message); break;
        default: break;
      }
    };
    return () => ws.close();
  }, [pushMsg, settleAll, pushPkt]);

  const send = useCallback(async () => {
    const scenario = input.trim();
    if (!scenario || busy) return;
    setInput(''); setBusy(true); pushMsg('user', scenario);
    try {
      const r = await fetch('/api/deliberate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scenario }),
      });
      const out = await r.json();
      pushMsg('magi', out.summary || out.error || '(no response)');
    } catch (err) {
      pushMsg('sys', 'error: ' + err.message);
    } finally {
      setBusy(false);
    }
  }, [input, busy, pushMsg]);

  // Build graph nodes/edges from state.
  const nodeBorder = (id) => {
    if (id === 'gateway') return 'var(--gw)';
    if (edgeDir[id] === 'out') return 'var(--gw)'; // receiving a request
    return COLOR[brains[id].verdict];
  };
  const node = (id) => ({
    id, position: NODE_POS[id], draggable: false,
    data: { label: id === 'gateway'
      ? html`<div><b>GATEWAY</b><div style=${{ fontSize: 11, color: 'var(--muted)' }}>Protocol 111</div></div>`
      : html`<div><b>${TITLE[id].split(' · ')[0]}</b><div style=${{ fontSize: 11, color: COLOR[brains[id].verdict] }}>${brains[id].verdict}</div></div>` },
    style: {
      background: 'var(--panel2)', color: 'var(--text)',
      border: `1px solid ${nodeBorder(id)}`,
      borderRadius: 8, width: 150, fontSize: 13,
    },
  });
  const nodes = ['gateway', ...BRAINS].map(node);
  // Custom packet edges: a dot travels gateway->brain ('out') or brain->gateway ('in').
  const edges = BRAINS.map((b) => {
    const dir = edgeDir[b] || 'idle';
    const active = motion && (dir === 'out' || dir === 'in');
    const color = dir === 'out' ? 'var(--gw)'
      : (dir === 'in' || dir === 'settled') ? COLOR[brains[b].verdict]
      : '#39414d';
    return {
      id: `e-${b}`, source: 'gateway', target: b, type: 'packet',
      data: { active, dir, color, sw: dir === 'idle' ? 1.5 : 2.5 },
    };
  });

  return html`
    <div class="app">
      <div class="bar">
        <h1>MAGI</h1>
        <span class="dot ${connected ? 'on' : ''}" title=${connected ? 'connected' : 'offline'}></span>
        <span style=${{ color: 'var(--muted)', fontSize: 12 }}>${status === 'deliberating' ? `round ${round}` : status}</span>
        <label class="toggle"><input type="checkbox" checked=${motion} onChange=${(e) => setMotion(e.target.checked)} /> motion</label>
        <span class="badge ${status}">${status === 'idle' ? 'awaiting scenario' : status.toUpperCase()}</span>
      </div>

      <div class="left">
        <div class="graphwrap">
          <${ReactFlow} nodes=${nodes} edges=${edges} edgeTypes=${edgeTypes} fitView proOptions=${{ hideAttribution: true }}
            nodesDraggable=${false} nodesConnectable=${false} elementsSelectable=${false} panOnDrag=${true} zoomOnScroll=${true}>
            <${Background} color="#262c36" gap=${20} />
          <//>
        </div>
        <div class="packets">
          <div class="phead"><span>PACKET LOG · gRPC gateway ⇄ brains</span><span>${packets.length}</span></div>
          <div class="plog" ref=${plogRef}>
            ${packets.map((p) => html`
              <div class="pkt ${p.dir}" key=${p.id}>
                <span class="dir">${p.dir === 'out' ? '▶' : p.dir === 'in' ? '◀' : '·'}</span>
                <span class="who">${p.who}</span>
                <span class="body"><span class="tag">${p.type}</span>${p.text}</span>
              </div>`)}
          </div>
        </div>
      </div>

      <div class="panels">
        <div class="cards">
          ${BRAINS.map((b) => html`
            <div class="card" key=${b}>
              <div class="name">${TITLE[b]}</div>
              <div class="row">
                <span class="verdict ${brains[b].verdict}">${brains[b].verdict}</span>
                ${brains[b].confidence != null && html`<span class="conf">conf ${brains[b].confidence}</span>`}
                ${brains[b].tool && html`<span class="tool">→ ${brains[b].tool}</span>`}
              </div>
              ${brains[b].reasoning && html`<div class="reason">${brains[b].reasoning}</div>`}
            </div>`)}
        </div>

        <div class="chat">
          <div class="thread" ref=${threadRef}>
            ${messages.length === 0 && html`<div class="msg sys">Describe your current scenario. The three Magi will deliberate and, on unanimous Protocol 111, act.</div>`}
            ${messages.map((m, i) => html`<div class="msg ${m.role}" key=${i}>${m.text}</div>`)}
          </div>
          <div class="compose">
            <input value=${input} placeholder="Describe your scenario…" disabled=${busy}
              onChange=${(e) => setInput(e.target.value)}
              onKeyDown=${(e) => e.key === 'Enter' && send()} />
            <button onClick=${send} disabled=${busy || !input.trim()}>${busy ? '…' : 'Send'}</button>
          </div>
        </div>
      </div>
    </div>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
