syntax = "proto3";

package magi;

option go_package = "magi/gen;magipb";

// Brain is implemented by each of the three Magi microservices (Melchior,
// Balthasar, Casper). The gateway is a gRPC client to all three.
service Brain {
  // Deliberate runs one isolated reasoning pass over the scenario and returns a
  // structured verdict. On re-deliberation rounds the request carries peer_dissent.
  rpc Deliberate(DeliberateRequest) returns (DeliberateResponse);
  // Health reports readiness and the model this brain is wired to.
  rpc Health(HealthRequest) returns (HealthResponse);
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  AFFIRMATIVE = 1; // proceed with the proposed action
  NEGATIVE = 2;    // do not proceed (Balthasar NEGATIVE = protective veto)
  ABSTAIN = 3;     // insufficient basis to decide
}

// ToolSpec advertises an available tool (native or MCP) to a brain.
message ToolSpec {
  string name = 1;
  string description = 2;
  string schema_json = 3; // JSON Schema of the tool's parameters
}

// ProposedAction is the tool a brain wants to invoke. Empty tool_name = observe/no-op.
message ProposedAction {
  string tool_name = 1;
  string args_json = 2; // JSON object of arguments
}

// PeerDissent carries another brain's prior-round position for re-deliberation.
message PeerDissent {
  string brain = 1;
  Verdict verdict = 2;
  string reasoning = 3;
  ProposedAction proposed_action = 4;
}

message DeliberateRequest {
  string scenario = 1;
  int32 round = 2;                     // 1-based deliberation round
  repeated ToolSpec tools = 3;         // available tool catalog
  repeated PeerDissent peer_dissent = 4; // empty on round 1
}

message DeliberateResponse {
  string brain = 1;
  Verdict verdict = 2;
  int32 confidence = 3; // 0-100
  string reasoning = 4;
  ProposedAction proposed_action = 5;
  int64 latency_ms = 6;
}

message HealthRequest {}

message HealthResponse {
  string brain = 1;
  string model = 2;
  bool ready = 3;
}
